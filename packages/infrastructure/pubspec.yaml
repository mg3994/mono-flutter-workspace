name: infrastructure
description: Infrastructure adapters for Dio, Drift, Firebase, and location services.
version: 0.1.0
publish_to: 'none'

resolution: workspace

environment:
  sdk: '^3.11.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  domain:
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  firebase_messaging: ^16.6.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  google_sign_in: ^7.2.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3

dev_dependencies:
  drift_dev: any
  build_runner: any
  build: any
  build_web_compilers: any
  flutter_test:
    sdk: flutter
